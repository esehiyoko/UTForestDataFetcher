name: Live API

# Runs the client against the real public API. Its address is internal for now, so it
# comes only from the repository secret UTFOREST_API_BASE_URL (masked in logs), and the
# runner must be able to reach it. Run it by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[plot]" nbconvert ipykernel
      - name: Live test
        env:
          UTFOREST_API_BASE_URL: ${{ secrets.UTFOREST_API_BASE_URL }}
        run: |
          test -n "$UTFOREST_API_BASE_URL" || { echo "Set the repository secret UTFOREST_API_BASE_URL" >&2; exit 1; }
          python -m unittest -v tests.test_weather.LiveApiTest
      - name: Run the example notebook
        env:
          UTFOREST_API_BASE_URL: ${{ secrets.UTFOREST_API_BASE_URL }}
        # Outputs are not uploaded: they are not needed and would only add size.
        run: jupyter nbconvert --to notebook --execute examples/weather_quickstart.ipynb --output-dir /tmp/nb
