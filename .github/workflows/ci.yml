name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[plot]"
      - name: Run tests
        # The fake API in tests/ needs no address. The live test runs in live.yml.
        run: python -m unittest discover -s tests -v

  no-endpoint:
    name: no API address in the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only doi.org, launch badges and placeholders may appear as URLs
        run: |
          if grep -rnE "https?://[^ \"')]+" src README.md .env.example examples binder \
             | grep -vE "https?://(doi\.org|dx\.doi\.org)|https://\.\.\.|example\.(invalid|org)|github\.com/esehiyoko|mybinder\.org|colab\.research\.google\.com|(localhost|127\.0\.0\.1):8000"; then
            echo "Remove the address above: API addresses are given at run time (UTFOREST_API_BASE_URL)." >&2
            exit 1
          fi

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
