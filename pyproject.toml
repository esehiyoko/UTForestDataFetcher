[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "UTForestDataFetcher"
version = "0.1.0.dev0"
description = "Python helper for UTokyo Forest weather data"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
