[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "UTForestDataFetcher"
dynamic = ["version"]
description = "Python helper for UTokyo Forest data (weather first)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]

[tool.setuptools.dynamic]
version = { attr = "UTForestDataFetcher.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
